<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulador Financiero Personal</title>
  <meta name="theme-color" content="#16302f" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2316302f'/%3E%3Ctext x='50%25' y='56%25' text-anchor='middle' dominant-baseline='middle' font-family='sans-serif' font-weight='700' font-size='28' fill='%238fd6c4'%3ES/%3C/text%3E%3C/svg%3E" />

  <!-- Aplica el tema guardado antes de pintar, para evitar el parpadeo -->
  <script>
    try {
      var savedTheme = localStorage.getItem('simulador-financiero:theme');
      if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;
    } catch (e) {}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Geist+Mono:wght@400;500;600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div id="app">
    <!-- La app se construye dinámicamente desde js/app.js -->
    <noscript>Esta aplicación necesita JavaScript habilitado para funcionar.</noscript>
  </div>

  <!-- Chart.js por CDN, usado solo para los gráficos del Dashboard y Análisis -->
  <script src="./js/app-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
